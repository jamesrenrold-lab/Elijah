name: Build Elijah Pirate

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Validate origin data
        run: python3 scripts/validate.py
      - name: Verify fractional XP bonuses
        run: |
          mkdir -p build/logic-tests
          javac -d build/logic-tests src/main/java/com/jamesrenrold/elijah/ExperienceBonus.java scripts/ExperienceBonusTest.java
          java -cp build/logic-tests ExperienceBonusTest
      - name: Compile and reobfuscate Forge mod
        run: gradle build --stacktrace
      - name: Package installation notes
        run: cp README.md build/libs/INSTALL.md
      - uses: actions/upload-artifact@v4
        with:
          name: Elijah-Pirate-1.20.1
          path: |
            build/libs/elijah-pirate-*.jar
            build/libs/INSTALL.md
          if-no-files-found: error
